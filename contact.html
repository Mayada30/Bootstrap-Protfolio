<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal portfolio of Your Name - web developer.">
  <meta name="author" content="Your Name">
  <title>Contact - Start Bootstrap</title>

  <!-- 📷 PHOTO: Favicon (small square icon shown in the browser tab).
       Put a 32x32 or 64x64 file at: assets/img/favicon.ico -->
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">

  <!-- Google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;500;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS + Bootstrap Icons (from CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Your own CSS (must come AFTER Bootstrap) -->
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column h-100 ">
  <main class="flex-shrink-0">
    <!-- ================= NAVIGATION ================= -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
      <div class="container px-5">
        <!-- 📷 PHOTO (optional): replace the text brand with a logo:
             <img src="assets/img/logo.png" alt="Logo" height="32"> -->
        <a class="navbar-brand" href="index.html"><span class="fw-bolder text-primary">Start Bootstrap</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="resume.html">Resume</a></li>
          <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ================= CONTACT ================= -->
    <section class="py-5">
      <div class="container px-5">
        <div class="bg-light rounded-4 py-5 px-4 px-md-5">
          <div class="text-center mb-5">
            <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 mb-3"><i class="bi bi-envelope"></i></div>
            <h1 class="fw-bolder">Get in touch</h1>
            <p class="lead fw-normal text-muted mb-0">Let's work together!</p>
          </div>
          <div class="row gx-5 justify-content-center">
            <div class="col-lg-8 col-xl-6">

              <!-- HOW TO MAKE THE FORM SEND REAL EMAILS:
                   1. Create a free account at https://formspree.io
                   2. Create a form and copy its ID
                   3. Replace YOUR_FORM_ID below -->
              <form id="contactForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" novalidate>

                <div class="form-floating mb-3">
                  <input class="form-control" id="name" name="name" type="text" placeholder="Enter your name..." required>
                  <label for="name">Full name</label>
                  <div class="invalid-feedback">Please enter your name.</div>
                </div>

                <div class="form-floating mb-3">
                  <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com" required>
                  <label for="email">Email address</label>
                  <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <div class="form-floating mb-3">
                  <input class="form-control" id="phone" name="phone" type="tel" placeholder="(123) 456-7890" required>
                  <label for="phone">Phone number</label>
                  <div class="invalid-feedback">Please enter your phone number.</div>
                </div>
                <div class="form-floating mb-3">
                  <textarea class="form-control" id="message" name="message" placeholder="Enter your message here..." style="height: 10rem" required></textarea>
                  <label for="message">Message</label>
                  <div class="invalid-feedback">Please write a message.</div>
                </div>
                <div class="d-grid"><button class="btn btn-primary btn-lg" type="submit">Send message</button></div>
              </form>

            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="bg-white py-4 mt-auto">
    <div class="container px-5">
      <div class="row align-items-center justify-content-between flex-column flex-sm-row">
        <div class="col-auto"><div class="small m-0">Copyright &copy; Your Name <span id="year">2026</span></div></div>
        <div class="col-auto">
          <a class="small" href="#">Privacy</a>
          <span class="mx-1">&middot;</span>
          <a class="small" href="#">Terms</a>
          <span class="mx-1">&middot;</span>
          <a class="small" href="contact.html">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS bundle (menu toggle etc.) then your own JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
